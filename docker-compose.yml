services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: delivery_platform
      MYSQL_USER: delivery
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: ./laravel
      dockerfile: ../docker/Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: delivery_platform
      DB_USERNAME: delivery
      DB_PASSWORD: secret
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    ports:
      - "8000:8000"
    volumes:
      - ./laravel:/app
    depends_on:
      db:
        condition: service_healthy
    # Note: `php artisan serve` (Laravel 13) launches the built-in server with a
    # minimal environment (only APP_ENV + PATH), ignoring the compose vars below
    # (DB_HOST, CACHE_STORE, ...). To make the web process inherit the full
    # environment we start the PHP built-in server directly using the framework
    # router (same router `artisan serve` uses), running from the public dir.
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan migrate --force &&
             cd public &&
             exec php -S 0.0.0.0:8000 -t . /app/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

volumes:
  mysql_data:
